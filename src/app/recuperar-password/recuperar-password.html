<div class="recuperar-container">
  <h2>Recuperar contraseña</h2>

  @if (!mensajeEnviado()) {
    <form [formGroup]="recuperarForm" (ngSubmit)="onSubmit()">
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" formControlName="email" />
      </div>

      <button type="submit" [disabled]="recuperarForm.invalid">Enviar</button>
    </form>
  } @else {
    <p class="exito">
      Si el correo existe en nuestro sistema, recibirás instrucciones para
      restablecer tu contraseña. (Funcionalidad en construcción)
    </p>
  }

  <p><a routerLink="/login">Volver a iniciar sesión</a></p>
</div>
